# Build experiment: unmodified Helium for Windows x64 on the standard free GitHub runner.
# No signing, no release, no paid services. The 15 stages copy upstream's build-steps.yml:
# each stage stops before the 6 hour job limit and the next one resumes. Cancel the run to stop.
name: nocturne-build-probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nocturne-build-probe
jobs:
  build-1:
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: false

  build-2:
    needs: build-1
    if: needs.build-1.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-3:
    needs: build-2
    if: needs.build-2.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-4:
    needs: build-3
    if: needs.build-3.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-5:
    needs: build-4
    if: needs.build-4.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-6:
    needs: build-5
    if: needs.build-5.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-7:
    needs: build-6
    if: needs.build-6.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-8:
    needs: build-7
    if: needs.build-7.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-9:
    needs: build-8
    if: needs.build-8.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-10:
    needs: build-9
    if: needs.build-9.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-11:
    needs: build-10
    if: needs.build-10.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-12:
    needs: build-11
    if: needs.build-11.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-13:
    needs: build-12
    if: needs.build-12.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-14:
    needs: build-13
    if: needs.build-13.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  build-15:
    needs: build-14
    if: needs.build-14.outputs.finished == 'false'
    uses: ./.github/workflows/nocturne-stage.yml
    with:
      from-artifact: true

  package:
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10, build-11, build-12, build-13, build-14, build-15]
    if: ${{ !cancelled() && contains(needs.*.outputs.finished, 'true') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare-environment
      - uses: ./.github/actions/stage
        with:
          from_artifact: true
          save_artifact: false
      - name: Package without signing
        working-directory: C:\helium-windows
        run: python package.py
      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-probe-unsigned
          path: |
            C:\helium-windows\build\*.exe
            C:\helium-windows\build\*.zip
          if-no-files-found: error
          retention-days: 4
