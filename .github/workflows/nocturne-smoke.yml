# Manual smoke test: does the unsigned build from run 45891468579 start and render a page?
name: nocturne-smoke-test
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nocturne-probe-unsigned
          run-id: 45891468579
          github-token: ${{ github.token }}
          path: dl
      - name: Start the browser and take screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots | Out-Null
          Get-ChildItem dl -Recurse | ForEach-Object { "{0}  {1}" -f $_.Name, $_.Length }
          $zip = Get-ChildItem dl -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "No portable zip in the artifact" }
          Expand-Archive $zip.FullName app
          $exe = Get-ChildItem app -Recurse -Include chrome.exe,helium.exe | Select-Object -First 1
          if (-not $exe) { throw "No browser executable found" }
          "Executable: $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru -ArgumentList "--headless=new","--no-first-run","--user-data-dir=$PWD\profile-a","--window-size=1280,800","--screenshot=$PWD\shots\page.png","https://example.com"
          if (-not $p.WaitForExit(90000)) { $p.Kill($true); "Headless run timed out" }
          if (-not (Test-Path shots\page.png)) { throw "The browser did not produce a page screenshot" }
          $w = Start-Process $exe.FullName -PassThru -ArgumentList "--no-first-run","--user-data-dir=$PWD\profile-b","--start-maximized","https://example.com"
          Start-Sleep 30
          "Window still running after 30 s: $(-not $w.HasExited)"
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save("$PWD\shots\window.png")
          } catch { "Desktop capture failed: $_" }
          if ($w.HasExited) { throw "The browser window closed by itself (exit code $($w.ExitCode))" }
          $w.Kill($true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: shots
          retention-days: 7
